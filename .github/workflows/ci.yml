name: Medeniyet Atlası CI & Doğrulama

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Bütünlük, Kültür & Veri Doğrulama
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name: Python 3.12 Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Bütünlük ve Standart Testlerini Çalıştır (test_integrity.py)
      run: |
        python tests/test_integrity.py -v

    - name: CLI Terminal Motoru Duman Testi (xray_cli.py)
      run: |
        python scripts/xray_cli.py stats
        python scripts/xray_cli.py culture turkiye
        python scripts/xray_cli.py epics
        python scripts/xray_cli.py architecture
        python scripts/xray_cli.py compare-culture turkiye japonya
